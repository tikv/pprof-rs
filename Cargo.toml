[package]
name = "pprof"
version = "0.15.0"
authors = ["Yang Keao <keao.yang@yahoo.com>"]
edition = "2021"
license = "Apache-2.0"
description = "An internal perf tools for rust programs."
repository = "https://github.com/tikv/pprof-rs"
documentation = "https://docs.rs/pprof/"
readme = "README.md"
rust-version = "1.74.0"  # MSRV

[features]
default = ["cpp"]
cpp = ["symbolic-demangle/cpp"]
flamegraph = ["inferno"]
frame-pointer = []

# A private feature to indicate either prost-codec or protobuf-codec is enabled.
_protobuf = []
prost-codec = ["prost", "prost-build", "sha2", "_protobuf"]
protobuf-codec = ["protobuf", "protobuf-codegen", "_protobuf"]
framehop-unwinder = ["framehop", "memmap2", "object"]
perfmaps = ["arc-swap"]
large-depth = []
huge-depth = []

[dependencies]
backtrace = { version = "0.3" }
once_cell = "1.9"
libc = "^0.2.66"
log = "0.4"
# A version range so cargo can unify nix with the version used elsewhere in the
# dependency graph. Only `sys::signal` and `nix::Error` are used (addr_validate
# talks to libc directly), and that surface is stable across 0.27-0.30. The "fs"
# feature is no longer needed now that the fd handling uses libc.
nix = { version = ">=0.27, <0.31", default-features = false, features = ["signal"] }
spin = "0.10"
tempfile = "3.1"
thiserror = "2.0"
findshlibs = "0.10"
cfg-if = "1.0"
smallvec = "1.7"

inferno = { version = "0.12", default-features = false, features = ["nameattr"], optional = true }
# A version range so cargo can unify prost with whatever compatible version the
# rest of the dependency graph already uses (0.12, 0.13 or 0.14), avoiding a
# duplicate prost in downstream builds. The checked-in generated protobuf code
# (proto/perftools.profiles.rs) is compatible with all three.
prost = { version = ">=0.12, <0.15", optional = true }
protobuf = { version = ">=3.7.2", optional = true }
criterion = {version = "0.5", optional = true}
aligned-vec = "0.6"

# framehop unwinder dependencies
framehop = { version = "0.13", optional = true }
memmap2 = { version = ">=0.5.5, <0.10", optional = true }
object = { version = ">=0.32, <0.38", optional = true }
arc-swap = { version = "1.7.1", optional = true }

[dependencies.symbolic-demangle]
version = "12.1"
default-features = false
features = ["rust"]

[dev-dependencies]
criterion = "0.5"
rand = "0.8.0"

[build-dependencies]
prost-build = { version = ">=0.12, <0.15", optional = true }
sha2 = { version = "0.10", optional = true }
protobuf-codegen = { version = "3.7.2", optional = true }

[[example]]
name = "flamegraph"
required-features = ["flamegraph"]

[[example]]
name = "profile_proto_with_prost"
required-features = ["protobuf", "prost-codec"]

[[example]]
name = "profile_proto_with_protobuf_codec"
required-features = ["protobuf", "protobuf-codec"]

[[example]]
name = "multithread_flamegraph"
required-features = ["flamegraph"]

[[example]]
name = "criterion"
required-features = ["flamegraph", "criterion"]

[[bench]]
name = "collector"
path = "benches/collector.rs"
harness = false

[[bench]]
name = "addr_validate"
path = "benches/addr_validate.rs"
harness = false

[package.metadata.docs.rs]
all-features = true
